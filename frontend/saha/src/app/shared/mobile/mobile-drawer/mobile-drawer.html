@if (drawerService.isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/50 z-40"
    (click)="close()">
  </div>

  <!-- Drawer panel: slides in from the leading edge (left in LTR, right in RTL), reuses sidebar content -->
  <div class="fixed top-0 bottom-0 start-0 z-50 w-[260px] overflow-y-auto shadow-2xl">
    <!-- Close button overlaid on the trailing corner of the drawer -->
    <button
      type="button"
      (click)="close()"
      aria-label="Close navigation menu"
      class="absolute top-3 end-3 z-10 w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[#f6ddae] hover:bg-white/20 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <!-- Sidebar renders its full nav inside the drawer -->
    <app-sidebar />
  </div>
}
