<!-- Fixed bottom nav bar — sales shell, mobile only -->
<nav class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-[#e4dfd5] flex items-end h-[64px] px-2 pb-safe">

  <!-- Dashboard -->
  <a [routerLink]="['/dashboard']"
     [class]="'flex flex-col items-center justify-center gap-1 flex-1 py-2 transition-colors ' +
       (isDashboardActive() ? 'text-[#34203a]' : 'text-[#8a8478]')">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    <span class="text-[10px] font-medium leading-none">Dashboard</span>
  </a>

  <!-- Inquiries -->
  <a [routerLink]="['/inquiries']"
     [class]="'flex flex-col items-center justify-center gap-1 flex-1 py-2 transition-colors ' +
       (isInquiriesActive() ? 'text-[#34203a]' : 'text-[#8a8478]')">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    </svg>
    <span class="text-[10px] font-medium leading-none">Inquiries</span>
  </a>

  <!-- FAB: New Inquiry — raised orange circle, sits above the bar -->
  <div class="flex flex-col items-center justify-end flex-1 relative" style="margin-bottom: 8px;">
    <a [routerLink]="['/inquiries/new']"
       class="w-[52px] h-[52px] rounded-full bg-[#ce8a28] flex items-center justify-center shadow-lg active:bg-[#b87922] transition-colors"
       style="margin-bottom: 4px;">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
      </svg>
    </a>
    <span class="text-[10px] font-medium leading-none text-[#8a8478] -mt-1">New</span>
  </div>

  <!-- Quotes -->
  <button
    type="button"
    (click)="navigateToQuotes()"
    [class]="'flex flex-col items-center justify-center gap-1 flex-1 py-2 transition-colors ' +
      (isQuotesActive() ? 'text-[#34203a]' : 'text-[#8a8478]')">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <span class="text-[10px] font-medium leading-none">Quotes</span>
  </button>

  <!-- Settings -->
  <a [routerLink]="['/hotel-profile']"
     [class]="'flex flex-col items-center justify-center gap-1 flex-1 py-2 transition-colors ' +
       (isSettingsActive() ? 'text-[#34203a]' : 'text-[#8a8478]')">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    <span class="text-[10px] font-medium leading-none">Settings</span>
  </a>

</nav>
