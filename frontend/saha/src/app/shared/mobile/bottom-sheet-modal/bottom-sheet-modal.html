@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/40 z-40"
    (click)="dismiss()">
  </div>

  <!-- Sheet -->
  <div class="fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-[20px] max-h-[90vh] flex flex-col shadow-2xl">
    <!-- Drag handle -->
    <div class="flex justify-center pt-3 pb-2 shrink-0">
      <div class="w-10 h-1 bg-[#e4dfd5] rounded-full"></div>
    </div>

    <!-- Header -->
    <div class="flex items-center justify-between px-5 pb-3 shrink-0">
      @if (title()) {
        <h2 class="text-[#34203a] font-bold text-[17px]">{{ title() }}</h2>
      } @else {
        <div></div>
      }
      <button
        type="button"
        (click)="dismiss()"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#faf7f2] text-[#8a8478]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Scrollable content -->
    <div class="flex-1 overflow-y-auto px-5">
      <ng-content />
    </div>

    <!-- Pinned action button -->
    <div class="px-5 py-4 border-t border-[#e4dfd5] shrink-0">
      <button
        type="button"
        (click)="onAction()"
        [disabled]="actionDisabled()"
        class="w-full bg-[#34203a] hover:bg-[#46294f] disabled:opacity-50 text-white font-semibold text-[15px] py-3.5 rounded-[12px] transition-colors">
        {{ actionLabel() }}
      </button>
    </div>
  </div>
}
