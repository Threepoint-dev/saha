<header class="bg-[#34203a] h-[70px] flex items-center justify-between px-5 md:px-10 py-[18px] w-full">
  <div class="flex items-center gap-3 min-w-0">
    <div class="w-[34px] h-[34px] rounded-[8px] bg-white/10 flex items-center justify-center shrink-0">
      <img src="/logo.svg" alt="SAHA logo" class="w-full h-full object-contain" />
    </div>
    <div class="flex flex-col gap-px leading-none min-w-0">
      <p class="text-white font-bold text-[16px] tracking-[0.16px]">SAHA</p>
      <p class="text-[#f6ddae] text-[11px] truncate">{{ subtitle() }}</p>
    </div>
  </div>

  <!-- User info: desktop only -->
  <div class="hidden md:flex items-center gap-3">
    @if (roleLabel) {
      <div class="bg-[#46294f] px-[10px] py-[5px] rounded-md">
        <p class="text-[#f6ddae] text-[10px] font-semibold">{{ roleLabel }}</p>
      </div>
    }
    @if (email) {
      <p class="text-[#f6ddae] text-[12px] font-medium">{{ email }}</p>
    }
    @if (initials) {
      <div class="bg-[#E8A33D] w-[36px] h-[36px] rounded-full flex items-center justify-center">
        <p class="text-white text-[12px] font-bold">{{ initials }}</p>
      </div>
    }
  </div>

  <!-- Hamburger: mobile only, opens the nav drawer. Sits on the far side (right in LTR, left in RTL). -->
  <button
    type="button"
    (click)="drawerService.toggle()"
    aria-label="Open navigation menu"
    class="md:hidden flex items-center justify-center w-9 h-9 rounded-[6px] text-[#f6ddae] hover:bg-white/10 transition-colors shrink-0 ms-2">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>
</header>
